  <h1>KDP 入力ひな形（Amazon.co.jp）</h1>
  <p class="note">完成した書籍プロジェクトでは、コピー用 UI 付きの <code>kdp-metadata.html</code> をこのフォルダに置く（フィールド一覧＋コピーボタン付きの完成例を型紙にできる）。</p>
  <h2>最低限そろえる項目</h2>
  <ul>
    <li>本のタイトル / サブタイトル</li>
    <li>著者名（フリガナ・ローマ字）</li>
    <li>内容紹介</li>
    <li>主なマーケットプレイス: Amazon.co.jp</li>
    <li>キーワード最大7 / カテゴリー最大3</li>
  </ul>
  <p>表紙文言と KDP タイトルは一致させる。出版後に変えにくい項目は特に確認。</p>
