<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      .t { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #3A3630; }
      .h { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .nt { font-size: 14px; font-weight: 700; fill: #3A3630; }
      .nd { font-size: 13px; font-weight: 500; fill: #5a5550; }
      .sm { font-size: 12.5px; font-weight: 600; fill: #5a5550; }
    </style>
  </defs>
  <rect width="960" height="420" fill="#FFFEFA"/>
  <text x="480" y="32" text-anchor="middle" class="t title">Gadget と Blueprint</text>

  <!-- Gadget — green focus -->
  <rect x="48" y="56" width="400" height="300" rx="14" fill="#ffffff" stroke="#2f9e5f" stroke-width="2"/>
  <rect x="48" y="56" width="400" height="44" rx="14" fill="#2f9e5f"/>
  <rect x="48" y="88" width="400" height="12" fill="#2f9e5f"/>
  <text x="248" y="85" text-anchor="middle" class="t h">Gadget</text>
  <text x="248" y="130" text-anchor="middle" class="t nt">自分専用の小さなアプリ</text>
  <text x="248" y="168" text-anchor="middle" class="t nd">手元で動く「道具」そのもの</text>
  <rect x="88" y="190" width="320" height="36" rx="8" fill="#f0faf4"/>
  <text x="248" y="213" text-anchor="middle" class="t sm">データや設定が入りうる</text>
  <rect x="88" y="238" width="320" height="36" rx="8" fill="#f0faf4"/>
  <text x="248" y="261" text-anchor="middle" class="t sm">直しても、他人のコピーには影響しない</text>
  <rect x="88" y="286" width="320" height="36" rx="8" fill="#f0faf4"/>
  <text x="248" y="309" text-anchor="middle" class="t sm">例: メモ画面、スライド、ボード</text>

  <!-- Blueprint — gray secondary -->
  <rect x="512" y="56" width="400" height="300" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.5"/>
  <rect x="512" y="56" width="400" height="44" rx="14" fill="#6e6a64"/>
  <rect x="512" y="88" width="400" height="12" fill="#6e6a64"/>
  <text x="712" y="85" text-anchor="middle" class="t h">Blueprint</text>
  <text x="712" y="130" text-anchor="middle" class="t nt">アプリのテンプレート</text>
  <text x="712" y="168" text-anchor="middle" class="t nd">配るための「型」</text>
  <rect x="552" y="190" width="320" height="36" rx="8" fill="#f3f1ec"/>
  <text x="712" y="213" text-anchor="middle" class="t sm">データやパスワードは付かない</text>
  <rect x="552" y="238" width="320" height="36" rx="8" fill="#f3f1ec"/>
  <text x="712" y="261" text-anchor="middle" class="t sm">相手は自分用の Gadget を起こせる</text>
  <rect x="552" y="286" width="320" height="36" rx="8" fill="#f3f1ec"/>
  <text x="712" y="309" text-anchor="middle" class="t sm">画面では Blueprints / Explore</text>

  <rect x="120" y="376" width="720" height="28" rx="8" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="5 3.5"/>
  <text x="480" y="394" text-anchor="middle" class="t sm">まず手元の Gadget を動かし、配りたくなったら Blueprint（テンプレート）にする</text>
</svg>
