<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <style>
      .t { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #3A3630; }
      .h { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .nt { font-size: 14px; font-weight: 700; fill: #3A3630; }
      .nd { font-size: 12.5px; font-weight: 500; fill: #5a5550; }
      .sm { font-size: 12px; font-weight: 600; fill: #3A3630; }
      .lbl { font-size: 11.5px; font-weight: 700; fill: #5a5550; }
      .lbl-g { font-size: 11.5px; font-weight: 700; fill: #247a48; }
      .cap { font-size: 12.5px; font-weight: 600; fill: #5a5550; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#8a8578"/>
    </marker>
    <marker id="arr-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2f9e5f"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFEFA"/>
  <text x="480" y="28" text-anchor="middle" class="t title">会社の入口は一つ、中は人ごと</text>

  <!-- company entrance bar — green (shared focus) -->
  <rect x="80" y="44" width="800" height="40" rx="10" fill="#2f9e5f"/>
  <text x="480" y="70" text-anchor="middle" class="t h">会社の Cloudflare OS（入口・ログインは共通）</text>

  <!-- three environments — gray, "you" slightly greener wash -->
  <rect x="100" y="108" width="200" height="96" rx="12" fill="#f0faf4" stroke="#2f9e5f" stroke-width="1.8"/>
  <text x="200" y="138" text-anchor="middle" class="t nt">あなたの環境</text>
  <text x="200" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="200" y="184" text-anchor="middle" class="t nd">＋ データ</text>

  <rect x="380" y="108" width="200" height="96" rx="12" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" class="t nt">同僚Aの環境</text>
  <text x="480" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="480" y="184" text-anchor="middle" class="t nd">＋ データ</text>

  <rect x="660" y="108" width="200" height="96" rx="12" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.5"/>
  <text x="760" y="138" text-anchor="middle" class="t nt">同僚Bの環境</text>
  <text x="760" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="760" y="184" text-anchor="middle" class="t nd">＋ データ</text>

  <rect x="115" y="214" width="170" height="22" rx="6" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.2"/>
  <text x="200" y="229" text-anchor="middle" class="t sm">既定＝個人用として作成</text>

  <line x1="320" y1="118" x2="320" y2="196" stroke="#d8d4cc" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="600" y1="118" x2="600" y2="196" stroke="#d8d4cc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="480" y="252" text-anchor="middle" class="t cap">環境どうしは、勝手には混ざらない</text>
  <text x="480" y="284" text-anchor="middle" class="t nt">ほかの人と使うときの二通り</text>

  <!-- ① copy — neutral gray -->
  <rect x="50" y="300" width="420" height="250" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.5"/>
  <rect x="50" y="300" width="420" height="38" rx="14" fill="#6e6a64"/>
  <rect x="50" y="326" width="420" height="12" fill="#6e6a64"/>
  <text x="260" y="325" text-anchor="middle" class="t h">① コピーして使う</text>

  <rect x="80" y="370" width="120" height="72" rx="10" fill="#f3f1ec" stroke="#c8c4bc" stroke-width="1.4"/>
  <text x="140" y="400" text-anchor="middle" class="t sm">あなたのアプリ</text>
  <text x="140" y="420" text-anchor="middle" class="t nd">データあり</text>

  <line x1="210" y1="406" x2="248" y2="406" stroke="#8a8578" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="214" y="384" width="32" height="40" rx="5" fill="#ffffff" stroke="#d8d4cc"/>
  <text x="230" y="402" text-anchor="middle" class="t lbl">設計</text>
  <text x="230" y="416" text-anchor="middle" class="t lbl">だけ</text>

  <rect x="258" y="370" width="120" height="72" rx="10" fill="#faf9f6" stroke="#c8c4bc" stroke-width="1.4"/>
  <text x="318" y="400" text-anchor="middle" class="t sm">相手の新しい</text>
  <text x="318" y="420" text-anchor="middle" class="t sm">コピー</text>

  <text x="260" y="472" text-anchor="middle" class="t nd">元のデータは付かない</text>
  <text x="260" y="494" text-anchor="middle" class="t nd">相手は自分の環境で使う</text>
  <text x="260" y="520" text-anchor="middle" class="t sm" fill="#5a5550">（Blueprint＝アプリのテンプレート）</text>

  <!-- ② share — green accent -->
  <rect x="490" y="300" width="420" height="250" rx="14" fill="#ffffff" stroke="#2f9e5f" stroke-width="2"/>
  <rect x="490" y="300" width="420" height="38" rx="14" fill="#2f9e5f"/>
  <rect x="490" y="326" width="420" height="12" fill="#2f9e5f"/>
  <text x="700" y="325" text-anchor="middle" class="t h">② 共有して一緒に使う</text>

  <rect x="580" y="370" width="240" height="72" rx="10" fill="#f0faf4" stroke="#2f9e5f" stroke-width="1.5"/>
  <text x="700" y="400" text-anchor="middle" class="t sm">同じアプリを開く</text>
  <text x="700" y="422" text-anchor="middle" class="t nd">アプリ・データを共同で見る</text>

  <rect x="560" y="470" width="90" height="36" rx="8" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.4"/>
  <text x="605" y="492" text-anchor="middle" class="t sm">あなた</text>
  <rect x="750" y="470" width="90" height="36" rx="8" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.4"/>
  <text x="795" y="492" text-anchor="middle" class="t sm">同僚</text>
  <path d="M655 480 H745" stroke="#2f9e5f" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
  <path d="M745 496 H655" stroke="#2f9e5f" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
  <text x="700" y="530" text-anchor="middle" class="t nd">同じアプリの中身を一緒に使う</text>
</svg>
