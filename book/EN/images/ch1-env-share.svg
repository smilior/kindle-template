<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <rect width="1000" height="380" fill="#FFFEFA"/>
  <text x="500" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#3A3630">Two ways to share</text>
  <rect x="60" y="70" width="400" height="260" rx="16" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="3"/>
  <text x="260" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#2f9e5f">Blueprint (template)</text>
  <text x="100" y="165" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Hand over the shape only</text>
  <text x="100" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Each person gets their own copy</text>
  <text x="100" y="235" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Data does not come along</text>
  <rect x="540" y="70" width="400" height="260" rx="16" fill="#f5f4f1" stroke="#c8c4bc" stroke-width="2"/>
  <text x="740" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#6e6a64">Share (co-edit)</text>
  <text x="580" y="165" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Work in the same place</text>
  <text x="580" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Same data, same tool</text>
  <text x="580" y="235" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">• Edit together</text>
</svg>
