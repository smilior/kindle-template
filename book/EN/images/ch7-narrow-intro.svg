<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#FFFEFA"/>
  <rect x="60" y="180" width="220" height="140" rx="16" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="3"/>
  <text x="170" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#3A3630" font-weight="600">Agent</text>
  <text x="170" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#6e6a64">Asks for work</text>
  <line x1="290" y1="250" x2="400" y2="250" stroke="#2f9e5f" stroke-width="3"/>
  <polygon points="400,240 425,250 400,260" fill="#2f9e5f"/>
  <rect x="430" y="160" width="280" height="180" rx="16" fill="#2f9e5f"/>
  <text x="570" y="235" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#FFFEFA" font-weight="600">Gatekeepers</text>
  <text x="570" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#e8f6ee">Holds the keys</text>
  <text x="570" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#d4efdf">Only what you allow</text>
  <line x1="720" y1="250" x2="830" y2="250" stroke="#2f9e5f" stroke-width="3"/>
  <polygon points="830,240 855,250 830,260" fill="#2f9e5f"/>
  <rect x="860" y="100" width="280" height="100" rx="14" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="3"/>
  <text x="1000" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#2f9e5f" font-weight="600">Allowed repo only</text>
  <text x="1000" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#3A3630">e.g. practice repository</text>
  <rect x="860" y="230" width="280" height="100" rx="14" fill="#f5f4f1" stroke="#c8c4bc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1000" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#8a8578" font-weight="600">Blocked</text>
  <text x="1000" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#8a8578">Secrets, entire org, etc.</text>
  <rect x="860" y="360" width="280" height="80" rx="14" fill="#f5f4f1" stroke="#c8c4bc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1000" y="408" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#8a8578">Keys never go to the AI</text>
  <text x="600" y="490" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#6e6a64">Only connected resources can talk to the outside</text>
</svg>
