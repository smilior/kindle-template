<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図8-1　確信度で、行き先を 3 つに分ける</text>

  <text class="m" x="40" y="128">confidence 0.0</text>
  <text class="m" x="352" y="128" text-anchor="middle">0.5</text>
  <text class="m" x="664" y="128" text-anchor="middle">0.9</text>
  <text class="m" x="940" y="128" text-anchor="end">1.0</text>

  <rect class="boxq" x="40" y="140" width="312" height="52" rx="8"/>
  <text class="b" x="196" y="172" text-anchor="middle">低い</text>
  <rect x="352" y="140" width="312" height="52" rx="8" fill="#f0faf4" stroke="#c8c4bc" stroke-width="1.5"/>
  <text class="b" x="508" y="172" text-anchor="middle">中くらい</text>
  <rect x="664" y="140" width="276" height="52" rx="8" fill="#2f9e5f"/>
  <text class="hw" x="802" y="172" text-anchor="middle">高い</text>

  <line x1="196" y1="198" x2="196" y2="228" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <line x1="508" y1="198" x2="508" y2="228" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <line x1="802" y1="198" x2="802" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="box" x="40" y="234" width="312" height="74" rx="10"/>
  <text class="h" x="196" y="266" text-anchor="middle">人が読む</text>
  <text class="s" x="196" y="291" text-anchor="middle">自分で規程を開いて確かめる</text>

  <rect class="box" x="352" y="234" width="312" height="74" rx="10"/>
  <text class="h" x="508" y="266" text-anchor="middle">本人に確認する</text>
  <text class="s" x="508" y="291" text-anchor="middle">「根拠はありますか」と聞く</text>

  <rect class="boxg" x="664" y="234" width="276" height="74" rx="10"/>
  <text class="h g" x="802" y="266" text-anchor="middle">自動で進める</text>
  <text class="s" x="802" y="291" text-anchor="middle">そのまま落とす／振り分ける</text>

  <rect class="note" x="664" y="336" width="276" height="54" rx="10"/>
  <text class="s g" x="802" y="360" text-anchor="middle">Jev の答え: 反している</text>
  <text class="s" x="802" y="380" text-anchor="middle">confidence 0.93 → いちばん右</text>

  <text class="m" x="40" y="352">0.5 と 0.9 は、あなたが決める数字。Jev は決めない。</text>
  <text class="m" x="40" y="374">真ん中を「本人に確認」にする。2 択にすると、迷ったものが全部あなたに来る。</text>
  <text class="m" x="40" y="396">質問ごとに数字を変える。付箋の印を付けるのと、規程を社員に伝えるのでは重さが違う。</text>

  <line x1="40" y1="416" x2="940" y2="416" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="444">取り消せない操作ほど、しきい値は高くする。迷ったら「人が読む」側に倒す。</text>
</svg>
