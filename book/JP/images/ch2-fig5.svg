<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図2-5　入力している最中に、画面を変える</text>

  <rect class="box" x="40" y="150" width="200" height="150" rx="10"/>
  <line x1="40" y1="182" x2="240" y2="182" stroke="#d8d4cc" stroke-width="1.2"/>
  <circle cx="60" cy="166" r="4" fill="#d8d4cc"/><circle cx="74" cy="166" r="4" fill="#d8d4cc"/><circle cx="88" cy="166" r="4" fill="#d8d4cc"/>
  <text class="h" x="140" y="212" text-anchor="middle">入力中のフォーム</text>
  <rect x="66" y="228" width="148" height="9" rx="4" fill="#e6e2da"/>
  <rect x="66" y="245" width="120" height="9" rx="4" fill="#e6e2da"/>
  <text class="s" x="140" y="284" text-anchor="middle">「PC が起動しなく…」</text>

  <text class="m" x="288" y="204" text-anchor="middle">手が止まるたび</text>
  <line x1="246" y1="228" x2="330" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="boxg" x="340" y="160" width="200" height="136" rx="12"/>
  <rect x="340" y="160" width="200" height="34" rx="12" fill="#2f9e5f"/>
  <rect x="340" y="182" width="200" height="12" fill="#2f9e5f"/>
  <text class="hw" x="440" y="184" text-anchor="middle">Jev</text>
  <text class="b" x="440" y="226" text-anchor="middle">FAQ で足りるか</text>
  <text class="s" x="440" y="250" text-anchor="middle">（noul ＋ choice）</text>
  <text class="s" x="440" y="278" text-anchor="middle">0.3 秒で返る</text>

  <rect class="boxg" x="700" y="120" width="240" height="60" rx="8"/>
  <text class="b g" x="820" y="146" text-anchor="middle">FAQ を横に出す</text>
  <text class="m" x="820" y="167" text-anchor="middle">送る前に自己解決できる</text>
  <rect class="box" x="700" y="196" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="222" text-anchor="middle">当番へつなぐ</text>
  <text class="m" x="820" y="243" text-anchor="middle">急ぎだと分かったとき</text>
  <rect class="box" x="700" y="272" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="298" text-anchor="middle">そのまま送らせる</text>
  <text class="m" x="820" y="319" text-anchor="middle">普通の問い合わせ</text>

  <path d="M545 208 L693 155" fill="none" stroke="#2f9e5f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M545 228 L693 226" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M545 250 L693 297" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>

  <path d="M820 338 L820 384 L140 384 L140 306" fill="none" stroke="#2f9e5f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text class="g" x="480" y="376" text-anchor="middle" font-size="13">画面に反映される</text>

  <line x1="40" y1="414" x2="940" y2="414" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="442">数秒かかる AI では、送信されたあとにしか間に合わない。0.3 秒なら、打っている最中に挟める。</text>
</svg>
