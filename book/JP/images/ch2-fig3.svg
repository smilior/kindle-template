<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図2-3　質問の重さで、使う AI を変える</text>

  <rect class="box" x="40" y="176" width="170" height="104" rx="10"/>
  <text class="h" x="125" y="210" text-anchor="middle">質問が届く</text>
  <text class="s" x="125" y="238" text-anchor="middle">「営業時間は？」も</text>
  <text class="s" x="125" y="259" text-anchor="middle">「返品したい」も</text>

  <line x1="215" y1="228" x2="263" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="boxg" x="270" y="158" width="210" height="140" rx="12"/>
  <rect x="270" y="158" width="210" height="34" rx="12" fill="#2f9e5f"/>
  <rect x="270" y="180" width="210" height="12" fill="#2f9e5f"/>
  <text class="hw" x="375" y="182" text-anchor="middle">Jev</text>
  <text class="b" x="375" y="224" text-anchor="middle">どれで足りるか</text>
  <text class="s" x="375" y="248" text-anchor="middle">（choice）</text>
  <text class="s" x="375" y="276" text-anchor="middle">0.06 秒 / 1 件</text>

  <rect class="box" x="700" y="116" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="142" text-anchor="middle">コードで返す</text>
  <text class="m" x="820" y="163" text-anchor="middle">営業時間。AI を呼ばない</text>
  <rect class="box" x="700" y="196" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="222" text-anchor="middle">小さい AI</text>
  <text class="m" x="820" y="243" text-anchor="middle">短い返事で足りる</text>
  <rect class="box" x="700" y="276" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="302" text-anchor="middle">大きい AI</text>
  <text class="m" x="820" y="323" text-anchor="middle">調べて考える必要がある</text>

  <path d="M485 208 L693 150" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M485 228 L693 226" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M485 250 L693 302" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>

  <line x1="40" y1="400" x2="940" y2="400" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="426">全部を大きい AI に回すと、「営業時間は？」にも高い料金と数秒の待ち時間がかかる。</text>
  <text class="m" x="40" y="450">かといって振り分けを大きい AI にやらせると、仕事を始める前に 1 回分の料金が乗る。</text>
</svg>
