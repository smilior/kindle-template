<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図2-1　Jev が返すのは分類だけ。仕分けるのはコード</text>
  <text class="m" x="235" y="96" text-anchor="middle">Jev がやるのは、ここまで</text>
  <text class="m" x="700" y="96" text-anchor="middle">ここから先は、あなたのコード</text>
  <line x1="470" y1="110" x2="470" y2="400" stroke="#d8d4cc" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect class="box" x="40" y="180" width="155" height="96" rx="10"/>
  <text class="h" x="117" y="215" text-anchor="middle">メールが届く</text>
  <text class="s" x="117" y="240" text-anchor="middle">「請求が二重に</text>
  <text class="s" x="117" y="259" text-anchor="middle">なっています」</text>

  <line x1="200" y1="228" x2="228" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="boxg" x="240" y="160" width="190" height="136" rx="12"/>
  <rect x="240" y="160" width="190" height="34" rx="12" fill="#2f9e5f"/>
  <rect x="240" y="182" width="190" height="12" fill="#2f9e5f"/>
  <text class="hw" x="335" y="184" text-anchor="middle">Jev</text>
  <text class="b" x="335" y="228" text-anchor="middle">分類を選択する</text>
  <text class="s" x="335" y="252" text-anchor="middle">（choice）</text>
  <text class="s" x="335" y="278" text-anchor="middle">0.1〜0.5 秒 / 1 通</text>

  <text class="m" x="476" y="214" text-anchor="middle">経理 0.88</text>
  <line x1="435" y1="228" x2="518" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="box" x="525" y="180" width="160" height="96" rx="10"/>
  <text class="h" x="605" y="213" text-anchor="middle">あなたのコード</text>
  <text class="s" x="605" y="238" text-anchor="middle">分類を見て</text>
  <text class="s" x="605" y="257" text-anchor="middle">仕分けを実行する</text>

  <rect class="box" x="740" y="120" width="200" height="54" rx="8"/>
  <text class="b" x="840" y="144" text-anchor="middle">経理</text>
  <text class="m" x="840" y="164" text-anchor="middle">請求・支払い</text>
  <rect class="box" x="740" y="188" width="200" height="54" rx="8"/>
  <text class="b" x="840" y="212" text-anchor="middle">技術</text>
  <text class="m" x="840" y="232" text-anchor="middle">不具合・連携</text>
  <rect class="box" x="740" y="256" width="200" height="54" rx="8"/>
  <text class="b" x="840" y="280" text-anchor="middle">営業</text>
  <text class="m" x="840" y="300" text-anchor="middle">料金・契約</text>

  <path d="M690 210 L733 150" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M690 228 L733 215" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M690 246 L733 280" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M690 262 L733 352" fill="none" stroke="#2f9e5f" stroke-width="2" marker-end="url(#ag)"/>
  <text class="g" x="684" y="330" font-size="13" text-anchor="end">確信度が低い</text>

  <rect class="note" x="740" y="330" width="200" height="60" rx="10"/>
  <text class="b g" x="840" y="356" text-anchor="middle">カテゴリ外</text>
  <text class="s" x="840" y="377" text-anchor="middle">人が開いて判断する</text>

  <line x1="40" y1="420" x2="940" y2="420" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="446">Jev は「経理」と 0.88 を返すだけ。フォルダへ動かすのも、人に回すのも、コードが決める。</text>
</svg>
