<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図2-4　大量のデータから、読むべきものだけ残す</text>

  <rect class="box" x="40" y="180" width="170" height="100" rx="10"/>
  <text class="h" x="125" y="220" text-anchor="middle">5,000 件</text>
  <text class="s" x="125" y="250" text-anchor="middle">たまった商品レビュー</text>

  <line x1="215" y1="230" x2="263" y2="230" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="boxg" x="270" y="162" width="215" height="136" rx="12"/>
  <rect x="270" y="162" width="215" height="34" rx="12" fill="#2f9e5f"/>
  <rect x="270" y="184" width="215" height="12" fill="#2f9e5f"/>
  <text class="hw" x="377" y="186" text-anchor="middle">Jev</text>
  <text class="b" x="377" y="228" text-anchor="middle">返信が要るか</text>
  <text class="s" x="377" y="252" text-anchor="middle">（noul）</text>
  <text class="s" x="377" y="280" text-anchor="middle">全件で数十秒・数円</text>

  <rect class="boxg" x="690" y="120" width="250" height="60" rx="8"/>
  <text class="b g" x="815" y="146" text-anchor="middle">残った 120 件</text>
  <text class="m" x="815" y="167" text-anchor="middle">返信が要りそう</text>

  <line x1="815" y1="186" x2="815" y2="214" stroke="#2f9e5f" stroke-width="2" marker-end="url(#ag)"/>

  <rect class="box" x="690" y="220" width="250" height="60" rx="8"/>
  <text class="b" x="815" y="246" text-anchor="middle">生成 AI が読む</text>
  <text class="m" x="815" y="267" text-anchor="middle">返信文を書く</text>

  <rect class="boxq" x="690" y="316" width="250" height="60" rx="8"/>
  <text class="b" x="815" y="342" text-anchor="middle">除いた 4,880 件</text>
  <text class="m" x="815" y="363" text-anchor="middle">生成 AI には渡さない</text>

  <path d="M490 208 L683 152" fill="none" stroke="#2f9e5f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M490 258 L683 340" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>

  <line x1="40" y1="410" x2="940" y2="410" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="438">5,000 件を全部 生成 AI に読ませると、時間も料金もかさむ。先に Jev で落としてから渡す。</text>
</svg>
