<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="1920" height="940">
  <rect x="0" y="0" width="960" height="470" fill="#FFFEFA"/>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; fill: #3A3630; }
    .t  { font-size: 26px; font-weight: 700; }
    .h  { font-size: 19px; font-weight: 700; }
    .hw { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .b  { font-size: 15px; }
    .s  { font-size: 13px; fill: #5a5550; }
    .m  { font-size: 13px; fill: #8A8578; }
    .g  { fill: #2f9e5f; }
    .box   { fill: #ffffff; stroke: #c8c4bc; stroke-width: 1.5; }
    .boxg  { fill: #f7fcf9; stroke: #2f9e5f; stroke-width: 2; }
    .boxq  { fill: #f4f2ee; stroke: #c8c4bc; stroke-width: 1.5; }
    .note  { fill: #f0faf4; stroke: #2f9e5f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f9e5f"/>
    </marker>
    <marker id="agr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>

  <text class="t" x="40" y="48">図2-2　AI が書いた文章を、出す前にチェックする</text>

  <rect class="box" x="40" y="180" width="160" height="96" rx="10"/>
  <text class="h" x="120" y="215" text-anchor="middle">AI</text>
  <text class="s" x="120" y="245" text-anchor="middle">下書きを書く</text>

  <text class="m" x="232" y="212" text-anchor="middle">下書き</text>
  <line x1="205" y1="228" x2="258" y2="228" stroke="#2f9e5f" stroke-width="2.5" marker-end="url(#ag)"/>

  <rect class="boxg" x="265" y="146" width="230" height="164" rx="12"/>
  <rect x="265" y="146" width="230" height="34" rx="12" fill="#2f9e5f"/>
  <rect x="265" y="168" width="230" height="12" fill="#2f9e5f"/>
  <text class="hw" x="380" y="170" text-anchor="middle">Jev</text>
  <text class="b" x="380" y="208" text-anchor="middle">根拠はあるか</text>
  <text class="b" x="380" y="232" text-anchor="middle">言い過ぎていないか</text>
  <text class="b" x="380" y="256" text-anchor="middle">個人情報はないか</text>
  <text class="s" x="380" y="288" text-anchor="middle">noul を 3 問、1 回で</text>

  <rect class="box" x="700" y="120" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="146" text-anchor="middle">そのまま出す</text>
  <text class="m" x="820" y="167" text-anchor="middle">3 つとも問題なし</text>
  <rect class="box" x="700" y="196" width="240" height="60" rx="8"/>
  <text class="b" x="820" y="222" text-anchor="middle">人が見る</text>
  <text class="m" x="820" y="243" text-anchor="middle">どれかが中途半端</text>
  <rect class="boxg" x="700" y="272" width="240" height="60" rx="8"/>
  <text class="b g" x="820" y="298" text-anchor="middle">書き直させる</text>
  <text class="m" x="820" y="319" text-anchor="middle">はっきり引っかかった</text>

  <path d="M500 210 L693 155" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M500 228 L693 226" fill="none" stroke="#8a8578" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M500 250 L693 297" fill="none" stroke="#2f9e5f" stroke-width="2" marker-end="url(#ag)"/>

  <path d="M820 336 L820 386 L120 386 L120 284" fill="none" stroke="#2f9e5f" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ag)"/>
  <text class="g" x="470" y="378" text-anchor="middle" font-size="13">直してもう一度</text>

  <line x1="40" y1="420" x2="940" y2="420" stroke="#e6e2da" stroke-width="1"/>
  <text class="m" x="40" y="446">Jev は直さない。どこが引っかかったかを数字で返すだけ。直すのは AI か、あなた。</text>
</svg>
