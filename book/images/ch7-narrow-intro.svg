<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#FFFEFA"/>
  <!-- Agent -->
  <rect x="60" y="180" width="220" height="140" rx="16" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="3"/>
  <text x="170" y="240" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="28" fill="#3A3630" font-weight="600">エージェント</text>
  <text x="170" y="280" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#6e6a64">お願いする側</text>
  <!-- arrow -->
  <line x1="290" y1="250" x2="390" y2="250" stroke="#2f9e5f" stroke-width="3"/>
  <polygon points="390,240 415,250 390,260" fill="#2f9e5f"/>
  <!-- Gatekeeper -->
  <rect x="420" y="160" width="280" height="180" rx="16" fill="#2f9e5f"/>
  <text x="560" y="230" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="28" fill="#FFFEFA" font-weight="600">Gatekeepers</text>
  <text x="560" y="268" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#e8f6ee">外への接続の窓口</text>
  <text x="560" y="305" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#d4efdf">鍵を持ち、必要なものだけ通す</text>
  <!-- arrow -->
  <line x1="710" y1="250" x2="810" y2="250" stroke="#2f9e5f" stroke-width="3"/>
  <polygon points="810,240 835,250 810,260" fill="#2f9e5f"/>
  <!-- External - narrow only -->
  <rect x="850" y="100" width="280" height="100" rx="14" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="3"/>
  <text x="990" y="145" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="22" fill="#2f9e5f" font-weight="600">許可したリポだけ</text>
  <text x="990" y="175" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#3A3630">例: 練習用リポジトリ</text>
  <rect x="850" y="230" width="280" height="100" rx="14" fill="#f5f4f1" stroke="#c8c4bc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="990" y="275" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="22" fill="#8a8578" font-weight="600">通さない</text>
  <text x="990" y="305" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#8a8578">社内秘密・全リポ一括 など</text>
  <rect x="850" y="360" width="280" height="80" rx="14" fill="#f5f4f1" stroke="#c8c4bc" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="990" y="408" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="20" fill="#8a8578">鍵は AI に渡さない</text>
  <!-- note -->
  <text x="600" y="480" text-anchor="middle" font-family="Hiragino Sans, sans-serif" font-size="18" fill="#6e6a64">選んだリソースだけが外とやりとりできる</text>
</svg>
