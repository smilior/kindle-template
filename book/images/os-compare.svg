    </linearGradient>
    <linearGradient id="spineBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#e4e9ef"/>
    </linearGradient>
    <g id="ico-pc">
