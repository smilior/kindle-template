<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 18px; font-weight: 700; fill: #141210; }
      .col-h { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; }
      .tag { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 600; fill: #2a2a28; }
      .spine { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; fill: #1a2430; }
      .val-l { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 600; fill: #141a22; }
      .val-r { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 600; fill: #141210; }
