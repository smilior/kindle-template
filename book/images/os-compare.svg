<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .title { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 18px; font-weight: 700; fill: #3A3630; }
      .col-h { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14.5px; font-weight: 700; fill: #ffffff; }
      .tag { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 600; fill: #6a6560; }
      .spine { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; fill: #3A3630; }
      .val { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 600; fill: #3A3630; }
      .foot { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 500; fill: #5a5550; }
    </style>
    <!-- point green #2f9e5f · neutrals only otherwise -->
    <g id="ico-pc">
      <rect x="0" y="2" width="18" height="12" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M3 16h12M6 16v2h6v-2" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="ico-chat">
      <rect x="1" y="1" width="16" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M5 13l-2 4 5-4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="7" cy="7" r="1.1" fill="#ffffff"/>
      <circle cx="10.5" cy="7" r="1.1" fill="#ffffff"/>
      <circle cx="14" cy="7" r="1.1" fill="#ffffff"/>
    </g>
  </defs>

  <!-- paper -->
  <rect width="960" height="520" fill="#FFFEFA"/>

  <!-- title -->
  <text x="480" y="34" text-anchor="middle" class="title">ふつうの OS と Cloudflare OS</text>
  <line x1="360" y1="44" x2="450" y2="44" stroke="#c8c4bc" stroke-width="2" stroke-linecap="round"/>
  <line x1="458" y1="44" x2="502" y2="44" stroke="#2f9e5f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="510" y1="44" x2="600" y2="44" stroke="#c8c4bc" stroke-width="2" stroke-linecap="round"/>

  <!-- spine panel (neutral) -->
  <rect x="416" y="140" width="128" height="312" rx="12" fill="#f3f1ec" stroke="#d8d4cc" stroke-width="1"/>

  <!-- LEFT: ordinary OS — gray -->
  <rect x="32" y="58" width="338" height="404" rx="12" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.3"/>
  <rect x="32" y="58" width="338" height="46" rx="12" fill="#6e6a64"/>
  <rect x="32" y="92" width="338" height="12" fill="#6e6a64"/>
  <rect x="32" y="104" width="338" height="2" fill="#b8b4ac"/>
  <use href="#ico-pc" x="50" y="72"/>
  <text x="209" y="87" text-anchor="middle" class="col-h">ふつうの OS（PC）</text>
  <text x="201" y="130" text-anchor="middle" class="tag">Windows / macOS など</text>

  <!-- RIGHT: Cloudflare OS — point green accent -->
  <rect x="590" y="58" width="338" height="404" rx="12" fill="#ffffff" stroke="#2f9e5f" stroke-width="2"/>
  <rect x="590" y="58" width="338" height="46" rx="12" fill="#2f9e5f"/>
  <rect x="590" y="92" width="338" height="12" fill="#2f9e5f"/>
  <rect x="590" y="104" width="338" height="2" fill="#8fd0a8"/>
  <use href="#ico-chat" x="608" y="71"/>
  <text x="767" y="87" text-anchor="middle" class="col-h">Cloudflare OS</text>
  <text x="759" y="130" text-anchor="middle" class="tag">ブラウザで開く AI の場所</text>

  <!-- row 1 -->
  <rect x="42" y="148" width="318" height="68" rx="8" fill="#f3f1ec"/>
  <rect x="600" y="148" width="318" height="68" rx="8" fill="#f0faf4"/>
  <rect x="426" y="168" width="108" height="28" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.2"/>
  <text x="480" y="186.5" text-anchor="middle" class="spine">使う場所</text>
  <line x1="362" y1="182" x2="422" y2="182" stroke="#b8b4ac" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="538" y1="182" x2="598" y2="182" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="362" cy="182" r="2.5" fill="#8a8578"/>
  <circle cx="598" cy="182" r="2.5" fill="#2f9e5f"/>
  <text x="201" y="187" text-anchor="middle" class="val">パソコンに入れて使う</text>
  <text x="759" y="187" text-anchor="middle" class="val">ブラウザで開いて使う</text>

  <!-- row 2 -->
  <rect x="42" y="224" width="318" height="68" rx="8" fill="#faf9f6"/>
  <rect x="600" y="224" width="318" height="68" rx="8" fill="#f7fcf9"/>
  <rect x="426" y="244" width="108" height="28" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.2"/>
  <text x="480" y="262.5" text-anchor="middle" class="spine">アプリの用意</text>
  <line x1="362" y1="258" x2="422" y2="258" stroke="#b8b4ac" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="538" y1="258" x2="598" y2="258" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="362" cy="258" r="2.5" fill="#8a8578"/>
  <circle cx="598" cy="258" r="2.5" fill="#2f9e5f"/>
  <text x="201" y="263" text-anchor="middle" class="val">ストアから探して入れる</text>
  <text x="759" y="263" text-anchor="middle" class="val">AI に頼んでその場で作る</text>

  <!-- row 3 -->
  <rect x="42" y="300" width="318" height="68" rx="8" fill="#f3f1ec"/>
  <rect x="600" y="300" width="318" height="68" rx="8" fill="#f0faf4"/>
  <rect x="426" y="320" width="108" height="28" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.2"/>
  <text x="480" y="338.5" text-anchor="middle" class="spine">操作のしかた</text>
  <line x1="362" y1="334" x2="422" y2="334" stroke="#b8b4ac" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="538" y1="334" x2="598" y2="334" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="362" cy="334" r="2.5" fill="#8a8578"/>
  <circle cx="598" cy="334" r="2.5" fill="#2f9e5f"/>
  <text x="201" y="339" text-anchor="middle" class="val">自分でメニューを操作する</text>
  <text x="759" y="339" text-anchor="middle" class="val">チャットで AI にお願いする</text>

  <!-- row 4 -->
  <rect x="42" y="376" width="318" height="68" rx="8" fill="#faf9f6"/>
  <rect x="600" y="376" width="318" height="68" rx="8" fill="#f7fcf9"/>
  <rect x="426" y="396" width="108" height="28" rx="14" fill="#ffffff" stroke="#c8c4bc" stroke-width="1.2"/>
  <text x="480" y="414.5" text-anchor="middle" class="spine">手元に残るもの</text>
  <line x1="362" y1="410" x2="422" y2="410" stroke="#b8b4ac" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="538" y1="410" x2="598" y2="410" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="362" cy="410" r="2.5" fill="#8a8578"/>
  <circle cx="598" cy="410" r="2.5" fill="#2f9e5f"/>
  <text x="201" y="415" text-anchor="middle" class="val">インストールしたアプリ</text>
  <text x="759" y="415" text-anchor="middle" class="val">自分専用の Gadget</text>

  <!-- footer note — light green wash, green dashed like callout-point -->
  <rect x="120" y="478" width="720" height="28" rx="8" fill="#f7fcf9" stroke="#2f9e5f" stroke-width="1.5" stroke-dasharray="5 3.5"/>
  <text x="480" y="496" text-anchor="middle" class="foot">標準の業務アプリを置き換えるものではなく、すき間を埋めるための場所</text>
</svg>
