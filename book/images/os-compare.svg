    </filter>
    <linearGradient id="hdrL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6b7c"/>
      <stop offset="100%" stop-color="#4a5868"/>
    </linearGradient>
    <linearGradient id="hdrR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8892f"/>
