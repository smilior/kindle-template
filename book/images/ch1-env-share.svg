<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <style>
      .t { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #141210; }
      .h { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .nt { font-size: 14px; font-weight: 700; fill: #1a1a18; }
      .nd { font-size: 12.5px; font-weight: 500; fill: #1a1a18; }
      .sm { font-size: 12px; font-weight: 600; fill: #1f1f1c; }
      .lbl { font-size: 11.5px; font-weight: 700; fill: #2a3a4a; }
      .lbl-o { font-size: 11.5px; font-weight: 700; fill: #8a4a0a; }
      .cap { font-size: 12.5px; font-weight: 600; fill: #2a2a28; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#5b6b7c"/>
    </marker>
    <marker id="arr-o" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#c96a12"/>
    </marker>
    <filter id="soft" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#1a1a1a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#f7f5f1"/>
  <text x="480" y="28" text-anchor="middle" class="t title">会社の入口は一つ、中は人ごと</text>
  <g filter="url(#soft)">
    <rect x="80" y="44" width="800" height="40" rx="10" fill="#5b6b7c"/>
  </g>
  <text x="480" y="70" text-anchor="middle" class="t h">会社の Cloudflare OS（入口・ログインは共通）</text>
  <g filter="url(#soft)">
    <rect x="100" y="108" width="200" height="96" rx="12" fill="#e8eef4" stroke="#5b6b7c" stroke-width="2"/>
  </g>
  <text x="200" y="138" text-anchor="middle" class="t nt" fill="#5b6b7c">あなたの環境</text>
  <text x="200" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="200" y="184" text-anchor="middle" class="t nd">＋ データ</text>
  <g filter="url(#soft)">
    <rect x="380" y="108" width="200" height="96" rx="12" fill="#eef2f5" stroke="#6a7a8a" stroke-width="2"/>
  </g>
  <text x="480" y="138" text-anchor="middle" class="t nt" fill="#6a7a8a">同僚Aの環境</text>
  <text x="480" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="480" y="184" text-anchor="middle" class="t nd">＋ データ</text>
  <g filter="url(#soft)">
    <rect x="660" y="108" width="200" height="96" rx="12" fill="#eef2f5" stroke="#6a7a8a" stroke-width="2"/>
  </g>
  <text x="760" y="138" text-anchor="middle" class="t nt" fill="#6a7a8a">同僚Bの環境</text>
  <text x="760" y="164" text-anchor="middle" class="t nd">個人用アプリ</text>
  <text x="760" y="184" text-anchor="middle" class="t nd">＋ データ</text>
  <rect x="115" y="214" width="170" height="22" rx="6" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.2"/>
  <text x="200" y="229" text-anchor="middle" class="t sm">既定＝個人用として作成</text>
  <line x1="320" y1="118" x2="320" y2="196" stroke="#b0b8c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="600" y1="118" x2="600" y2="196" stroke="#b0b8c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="252" text-anchor="middle" class="t cap">環境どうしは、勝手には混ざらない</text>
  <text x="480" y="284" text-anchor="middle" class="t nt">ほかの人と使うときの二通り</text>
  <g filter="url(#soft)">
    <rect x="50" y="300" width="420" height="250" rx="14" fill="#fbfcfd" stroke="#5b6b7c" stroke-width="2"/>
  </g>
  <rect x="50" y="300" width="420" height="38" rx="14" fill="#5b6b7c"/>
  <rect x="50" y="326" width="420" height="12" fill="#5b6b7c"/>
  <text x="260" y="325" text-anchor="middle" class="t h">① コピーして使う</text>
  <rect x="80" y="370" width="120" height="72" rx="10" fill="#e8eef4" stroke="#5b6b7c" stroke-width="1.8"/>
  <text x="140" y="400" text-anchor="middle" class="t sm">あなたのアプリ</text>
  <text x="140" y="420" text-anchor="middle" class="t nd">データあり</text>
  <line x1="210" y1="406" x2="248" y2="406" stroke="#5b6b7c" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="214" y="384" width="32" height="40" rx="5" fill="#ffffff" stroke="#c8c8c4"/>
  <text x="230" y="402" text-anchor="middle" class="t lbl">設計</text>
  <text x="230" y="416" text-anchor="middle" class="t lbl">だけ</text>
  <rect x="258" y="370" width="120" height="72" rx="10" fill="#eef2f5" stroke="#6a7a8a" stroke-width="1.8"/>
  <text x="318" y="400" text-anchor="middle" class="t sm">相手の新しい</text>
  <text x="318" y="420" text-anchor="middle" class="t sm">コピー</text>
  <text x="260" y="472" text-anchor="middle" class="t nd">元のデータは付かない</text>
  <text x="260" y="494" text-anchor="middle" class="t nd">相手は自分の環境で使う</text>
  <text x="260" y="520" text-anchor="middle" class="t sm" fill="#3a4a5a">（Blueprint＝アプリのテンプレート）</text>
  <g filter="url(#soft)">
    <rect x="490" y="300" width="420" height="250" rx="14" fill="#fffdf9" stroke="#c96a12" stroke-width="2"/>
  </g>
  <rect x="490" y="300" width="420" height="38" rx="14" fill="#e8892f"/>
  <rect x="490" y="326" width="420" height="12" fill="#e8892f"/>
  <text x="700" y="325" text-anchor="middle" class="t h">② 共有して一緒に使う</text>
  <rect x="580" y="370" width="240" height="72" rx="10" fill="#ffefd9" stroke="#c96a12" stroke-width="1.8"/>
  <text x="700" y="400" text-anchor="middle" class="t sm">同じアプリを開く</text>
  <text x="700" y="422" text-anchor="middle" class="t nd">アプリ・データを共同で見る</text>
  <rect x="560" y="470" width="90" height="36" rx="8" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="605" y="492" text-anchor="middle" class="t sm">あなた</text>
  <rect x="750" y="470" width="90" height="36" rx="8" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.5"/>
  <text x="795" y="492" text-anchor="middle" class="t sm">同僚</text>
  <path d="M655 480 H745" stroke="#c96a12" stroke-width="2" fill="none" marker-end="url(#arr-o)"/>
  <path d="M745 496 H655" stroke="#c96a12" stroke-width="2" fill="none" marker-end="url(#arr-o)"/>
  <text x="700" y="530" text-anchor="middle" class="t nd">同じアプリの中身を一緒に使う</text>
</svg>